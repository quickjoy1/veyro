    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <script>
      try {
        const pref = localStorage.getItem("themePreference");
        const theme = localStorage.getItem("theme");
        const effectivePref = pref || theme;
        const systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        const isBlack = effectivePref === "black";
        const isDark =
          isBlack ||
          effectivePref === "dark" ||
          (!effectivePref && systemDark) ||
          (effectivePref === "auto" && systemDark);

        // Colours come from the CSS variables, so only the classes are set here.
        document.documentElement.classList.toggle("dark", isDark);
        document.documentElement.classList.toggle("oled", isBlack);
        document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
      } catch (e) {}
    </script>
